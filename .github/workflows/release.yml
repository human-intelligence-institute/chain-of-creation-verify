# Publish the WebAssembly verifier and its sha256 for every `v*` tag.
#
# All third-party actions are SHA-pinned (supply-chain hardening). Bump a pin with:
#   gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq '.object.sha'
#
# ⚠️ The wasm MUST be built the way an auditor builds it: from a throwaway module
# that `go get`s THIS module at the pushed tag. Building from the checked-out tree
# makes this repo the *main* module, and Go embeds that fact in debug.BuildInfo, so
# the bytes differ even with -trimpath. A hash produced that way would be
# unreproducible by anyone following README.md's "Verifying the hosted verifier".
# That is the whole point of this job, so do not "simplify" it to `go build ./cmd/...`.
#
# ⚠️ `go get` names the PACKAGE path, not just the module path. Fetching the module
# alone does not record the go.sum entries the build needs and the build fails.
name: Release

on:
  push:
    tags: ['v*']

# Least-privilege by default; the release job widens this for itself only.
permissions:
  contents: read

jobs:
  wasm-release:
    runs-on: ubuntu-latest
    permissions:
      # Required to create the GitHub Release and upload its assets.
      contents: write
    steps:
      # Checked out only to pin the toolchain from go.mod — the build below does
      # NOT use this tree.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build cocverify.wasm from a scratch module at ${{ github.ref_name }}
        env:
          # Pin the toolchain to the one setup-go installed: a different Go
          # version yields different bytes.
          GOTOOLCHAIN: local
          MODULE: github.com/human-intelligence-institute/chain-of-creation-verify
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/verify-check"
          cd "$RUNNER_TEMP/verify-check"
          go mod init check
          # Give proxy.golang.org a moment to observe the freshly pushed tag.
          # Probed from inside the scratch module, where this module is an
          # ordinary dependency.
          for i in 1 2 3 4 5 6; do
            if go list -m "$MODULE@$TAG" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          go get "$MODULE/cmd/wasmverify@$TAG"
          GOOS=js GOARCH=wasm go build -trimpath \
            -o "$GITHUB_WORKSPACE/cocverify.wasm" "$MODULE/cmd/wasmverify"

      - name: Write cocverify.wasm.sha256
        run: |
          set -eux
          sha256sum cocverify.wasm | tee cocverify.wasm.sha256

      - name: Create the release and attach both artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          SHA256="$(cut -d' ' -f1 < cocverify.wasm.sha256)"
          BYTES="$(wc -c < cocverify.wasm | tr -d ' ')"
          cat > notes.md <<NOTES
          ## WebAssembly verifier

          \`cocverify.wasm\` — sha256 \`$SHA256\` ($BYTES bytes)

          Built from a scratch module that depends on this module at \`$TAG\`, exactly as
          described in README.md § "Verifying the hosted verifier". Reproduce it with:

          \`\`\`sh
          mkdir /tmp/verify-check && cd /tmp/verify-check
          go mod init check
          go get github.com/human-intelligence-institute/chain-of-creation-verify/cmd/wasmverify@$TAG
          GOOS=js GOARCH=wasm go build -trimpath -o mine.wasm \\
            github.com/human-intelligence-institute/chain-of-creation-verify/cmd/wasmverify
          shasum -a 256 mine.wasm
          \`\`\`

          Cloning this repo and running \`go build ./cmd/wasmverify\` gives different bytes —
          that is \`debug.BuildInfo\` recording a different main module, not tampering.
          NOTES
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            cocverify.wasm cocverify.wasm.sha256
